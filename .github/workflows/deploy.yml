name: deploy-book

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installs pinned jupyter-book (classic v1) + deps from requirements.txt.
      # NOTE: do NOT run an unpinned `pip install jupyter-book` here — it now
      # pulls v2.x, a different engine that cannot build this _config.yml/_toc.yml book.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the book
        run: jupyter-book build .

      - name: Create CNAME file
        run: echo 'go-green.house' > _build/html/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./_build/html
          publish_branch: gh-pages
          keep_files: false
